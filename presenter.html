<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Presenter view</title>
<style>
  :root {
    --bg: #0E1730;
    --ink: #F7F3EC;
    --ink-soft: #C9D2E0;
    --muted: #7A90B8;
    --hairline: rgba(247, 243, 236, 0.12);
    --accent: #D8901F;
    --bad: #C4452B;
    --good: #4A9A6B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px; padding: 16px 32px;
    border-bottom: 1px solid var(--hairline);
  }
  .status {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--bad); flex-shrink: 0;
    transition: background 200ms ease;
  }
  .dot[data-live] { background: var(--good); }
  .count { font-size: 20px; letter-spacing: 0.04em; }
  .count .total { color: var(--muted); }

  main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 18px;
    padding: 24px 40px;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent);
  }
  .slide-label {
    font-size: 20px; color: var(--ink-soft);
    margin-top: -10px; min-height: 24px;
  }
  .note {
    flex: 1; min-height: 0; overflow-y: auto;
    font-size: 38px; line-height: 1.36;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note.empty { color: var(--muted); font-style: italic; }

  .next {
    flex-shrink: 0;
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--accent);
    background: rgba(247, 243, 236, 0.04);
    padding: 14px 20px;
  }
  .next[hidden] { display: none; }
  .next-label {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .next-text {
    font-size: 16px; line-height: 1.5; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── Time plan ──────────────────────────────────────────────────────── */
  .plan { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .plan[hidden] { display: none; }
  .plan-bar {
    height: 6px; width: 100%; border-radius: 3px;
    background: rgba(247, 243, 236, 0.10); overflow: hidden;
  }
  .plan-fill {
    height: 100%; width: 0%;
    background: var(--good);
    transition: width 400ms linear, background 300ms ease;
  }
  .plan-fill[data-over] { background: var(--bad); }
  .plan-row {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px; font-size: 13px; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .plan-row b { font-weight: 500; color: var(--ink-soft); font-size: 15px; }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px; padding: 14px 32px;
    border-top: 1px solid var(--hairline);
  }
  .clock { display: flex; align-items: baseline; gap: 14px; }
  .clock .elapsed { font-size: 26px; color: var(--ink); }
  .clock .target { color: var(--muted); font-size: 15px; }
  .pace {
    font-size: 15px; padding: 4px 12px; border-radius: 3px;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--hairline); color: var(--muted);
  }
  .pace[data-state="ahead"] { color: var(--good); border-color: rgba(74,154,107,0.5); }
  .pace[data-state="behind"] { color: var(--bad); border-color: rgba(196,69,43,0.5); }
  .pace[data-state="on"] { color: var(--ink-soft); }
  .pace[hidden] { display: none; }

  .hint { font-size: 11px; color: var(--muted); }
  kbd {
    font-family: inherit; font-size: 10px;
    padding: 2px 6px; margin: 0 2px;
    background: rgba(247, 243, 236, 0.08);
    border: 1px solid var(--hairline); border-radius: 3px;
    color: var(--ink);
  }
  button {
    font: inherit; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 7px 12px; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 3px;
  }
  button:hover { color: var(--ink); border-color: var(--accent); }

  .banner {
    padding: 10px 32px; text-align: center;
    font-size: 13px; background: #6B2D1F; color: #fff;
  }
  .banner[hidden] { display: none; }
</style>
</head>
<body>
  <div class="banner mono" id="banner" hidden></div>

  <header>
    <div class="status mono">
      <span class="dot" id="dot"></span>
      <span id="status-text">Waiting for deck…</span>
    </div>
    <div class="count mono">
      <span id="current">—</span><span class="total"> / <span id="total">—</span></span>
    </div>
  </header>

  <main>
    <div class="eyebrow mono">Now speaking</div>
    <div class="slide-label" id="slide-label"></div>
    <div class="note empty" id="note">Waiting for the deck to report its position…</div>

    <div class="plan" id="plan" hidden>
      <div class="plan-bar"><div class="plan-fill" id="plan-fill"></div></div>
      <div class="plan-row mono">
        <span>This slide <b id="plan-spent">0:00</b> / <b id="plan-budget">0:00</b></span>
        <span id="plan-remaining"></span>
      </div>
    </div>

    <div class="next" id="next" hidden>
      <div class="next-label mono">Next · <span id="next-label"></span></div>
      <div class="next-text" id="next-text"></div>
    </div>
  </main>

  <footer>
    <div class="clock mono">
      <span class="elapsed" id="elapsed">00:00</span>
      <span class="target" id="target"></span>
      <span class="pace" id="pace" hidden></span>
    </div>
    <div class="hint mono">
      <kbd>←</kbd><kbd>→</kbd> navigate · <kbd>R</kbd> reset clock · <kbd>F</kbd> fullscreen
    </div>
    <button id="reset">Reset clock</button>
  </footer>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const CHANNEL = params.get('channel') || 'deck-stage';
  const STALE_MS = 6000;      // no heartbeat for this long → show disconnected
  const HELLO_MS = 1500;      // keep announcing until the deck answers
  const RETRY_MS = 5000;      // back off between failed deck fetches

  const el = (id) => document.getElementById(id);
  const ui = {
    banner: el('banner'), dot: el('dot'), status: el('status-text'),
    current: el('current'), total: el('total'),
    label: el('slide-label'), note: el('note'),
    next: el('next'), nextLabel: el('next-label'), nextText: el('next-text'),
    plan: el('plan'), planFill: el('plan-fill'), planSpent: el('plan-spent'),
    planBudget: el('plan-budget'), planRemaining: el('plan-remaining'),
    elapsed: el('elapsed'), target: el('target'), pace: el('pace'),
    reset: el('reset'),
  };

  let notes = [];
  let plan = null;            // minutes per slide, or null when the deck has none
  let planCumulative = [];    // seconds scheduled before each slide
  let planTotal = 0;          // seconds
  let deckUrl = null;
  let lastFetch = 0;
  let total = 0;
  let lastSeen = 0;
  let index = -1;
  let label = '';
  let slideArrivedAt = Date.now();

  // Survive a reload of this window mid-talk: losing the clock in front of an
  // audience is worse than the small amount of state we keep here.
  const CLOCK_KEY = 'deck-stage:clock';
  let startTime = Number(sessionStorage.getItem(CLOCK_KEY)) || Date.now();
  const persistClock = () => {
    try { sessionStorage.setItem(CLOCK_KEY, String(startTime)); } catch (_) {}
  };
  persistClock();

  // ── Formatting ─────────────────────────────────────────────────────────
  const pad = (n) => String(n).padStart(2, '0');
  function clock(seconds) {
    const s = Math.max(0, Math.round(seconds));
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  }
  function signed(seconds) {
    const s = Math.round(Math.abs(seconds));
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  }

  // ── Time plan ──────────────────────────────────────────────────────────
  function setPlan(minutes) {
    if (!Array.isArray(minutes) || !minutes.length) {
      plan = null;
      ui.plan.hidden = true;
      ui.pace.hidden = true;
      ui.target.textContent = '';
      return;
    }
    plan = minutes.map((m) => Math.max(0, Number(m) || 0) * 60);
    planCumulative = [];
    let running = 0;
    for (const seconds of plan) {
      planCumulative.push(running);
      running += seconds;
    }
    planTotal = running;
    ui.target.textContent = `/ plan ${clock(planTotal)}`;
  }

  function tick() {
    const now = Date.now();
    const elapsed = (now - startTime) / 1000;
    ui.elapsed.textContent = clock(elapsed);

    if (!plan || index < 0 || index >= plan.length) {
      ui.plan.hidden = true;
      ui.pace.hidden = true;
      return;
    }

    const budget = plan[index];
    const spent = (now - slideArrivedAt) / 1000;

    ui.plan.hidden = false;
    ui.planSpent.textContent = clock(spent);
    ui.planBudget.textContent = clock(budget);
    const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
    ui.planFill.style.width = `${pct}%`;
    ui.planFill.toggleAttribute('data-over', budget > 0 && spent > budget);

    const left = planTotal - planCumulative[index] - Math.min(spent, budget);
    ui.planRemaining.textContent = `${clock(Math.max(0, left))} left in plan`;

    // Drift against the plan. While you are still inside the current slide's
    // budget this holds steady at whatever it was on arrival — it only starts
    // growing once you overrun. That makes it readable at a glance mid-talk
    // instead of ticking up every second.
    const owed = planCumulative[index] + Math.min(spent, budget);
    const drift = elapsed - owed;

    ui.pace.hidden = false;
    if (Math.abs(drift) < 15) {
      ui.pace.dataset.state = 'on';
      ui.pace.textContent = 'on plan';
    } else if (drift > 0) {
      ui.pace.dataset.state = 'behind';
      ui.pace.textContent = `${signed(drift)} behind`;
    } else {
      ui.pace.dataset.state = 'ahead';
      ui.pace.textContent = `${signed(drift)} ahead`;
    }
  }
  setInterval(tick, 500);

  ui.reset.addEventListener('click', resetClock);
  function resetClock() {
    startTime = Date.now();
    slideArrivedAt = startTime;
    persistClock();
    tick();
  }

  // ── Deck document: notes + plan ────────────────────────────────────────
  // Fetched straight from the deck, so the presenter never needs a handle on
  // the deck window and survives either side reloading.
  async function loadDeck(rawUrl) {
    if (!rawUrl) return;
    // Drop the fragment: deck-stage keeps #<slide> in sync with the current
    // position, so an unstripped URL would look "new" on every navigation.
    const url = new URL(rawUrl, location.href).href.split('#')[0];
    if (url === deckUrl) return;
    if (Date.now() - lastFetch < RETRY_MS) return;
    lastFetch = Date.now();

    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');

      const notesTag = doc.getElementById('speaker-notes');
      if (notesTag) {
        const parsed = JSON.parse(notesTag.textContent || '[]');
        if (Array.isArray(parsed)) notes = parsed;
      }

      const planTag = doc.getElementById('deck-plan');
      if (planTag) {
        const parsed = JSON.parse(planTag.textContent || 'null');
        setPlan(Array.isArray(parsed) ? parsed : (parsed && parsed.slides));
      } else {
        setPlan(null);
      }

      deckUrl = url;   // stop asking, even if the deck carried neither block
      if (!notesTag) note('This deck has no #speaker-notes block.', true);
      else render();
    } catch (err) {
      // Keep retrying on the heartbeat — a deck reload or a restarted server
      // fixes itself. Never clobber notes we already have.
      console.warn('[presenter] Could not load deck:', err);
      if (!notes.length) {
        note(`Could not read speaker notes from ${url} — ${err.message}`, true);
      }
    }
  }

  function note(text, isEmpty) {
    ui.note.textContent = text;
    ui.note.classList.toggle('empty', !!isEmpty);
  }

  // ── Rendering ──────────────────────────────────────────────────────────
  function render() {
    if (index < 0) return;
    ui.current.textContent = String(index + 1);
    ui.total.textContent = total ? String(total) : '—';
    ui.label.textContent = label.replace(/^\d+\s+/, '');

    const current = notes[index];
    if (current) note(current, false);
    else note('(no note for this slide)', true);

    const upcoming = notes[index + 1];
    if (upcoming && (!total || index + 1 < total)) {
      ui.nextText.textContent = upcoming;
      ui.nextLabel.textContent = `slide ${index + 2}`;
      ui.next.hidden = false;
    } else {
      ui.next.hidden = true;
    }
    tick();
  }

  function setLive(live) {
    ui.dot.toggleAttribute('data-live', live);
    ui.status.textContent = live ? 'Connected' : 'Deck not responding';
    ui.banner.hidden = live;
    if (!live) {
      ui.banner.textContent =
        'Lost the deck. Is the deck window still open, and served over http:// ?';
    }
  }

  // ── Channel ────────────────────────────────────────────────────────────
  if (typeof BroadcastChannel === 'undefined') {
    note(
      'This browser has no BroadcastChannel, or the page was opened as a ' +
      'file:// URL. Serve the deck folder over http:// and reopen.', true
    );
    ui.banner.hidden = false;
    ui.banner.textContent = 'No channel available — serve over http://';
    return;
  }

  const bus = new BroadcastChannel(CHANNEL);

  bus.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.type !== 'state') return;

    lastSeen = Date.now();
    setLive(true);

    if (typeof msg.total === 'number' && msg.total > 0) total = msg.total;
    if (typeof msg.label === 'string') label = msg.label;
    if (msg.target && !plan) ui.target.textContent = `/ target ${msg.target}`;

    const changed = msg.index !== index;
    if (changed) slideArrivedAt = Date.now();
    index = msg.index;
    if (changed || !notes.length) render();

    if (msg.deckUrl) loadDeck(msg.deckUrl);
  });

  const sayHello = () => bus.postMessage({ type: 'hello' });
  sayHello();
  setInterval(() => { if (Date.now() - lastSeen > HELLO_MS) sayHello(); }, HELLO_MS);
  setInterval(() => setLive(Date.now() - lastSeen < STALE_MS), 1000);

  // Optimistic first paint: the deck path is in the query string, so notes can
  // load before the first heartbeat arrives.
  if (params.get('deck')) loadDeck(params.get('deck'));

  // ── Keyboard: drive the deck from this window ──────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case ' ':
        e.preventDefault(); bus.postMessage({ type: 'nav', dir: 'next' }); break;
      case 'ArrowLeft': case 'PageUp':
        e.preventDefault(); bus.postMessage({ type: 'nav', dir: 'prev' }); break;
      case 'Home':
        e.preventDefault(); bus.postMessage({ type: 'nav', dir: 'first' }); break;
      case 'r': case 'R':
        resetClock(); break;
      case 'f': case 'F':
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        break;
    }
  });

  setLive(false);
  tick();
})();
</script>
</body>
</html>
