<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Operator panel</title>
<style>
  :root {
    --bg: #0E1730;
    --raised: #16213F;
    --sunken: #0A1226;
    --ink: #F7F3EC;
    --ink-soft: #C9D2E0;
    --muted: #7A90B8;
    --hairline: rgba(247, 243, 236, 0.12);
    --accent: #D8901F;
    --bad: #C4452B;
    --good: #4A9A6B;

    --rundown-w: 300px;
    --preview-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Banner ─────────────────────────────────────────────────────────── */
  .banner {
    padding: 8px 24px; text-align: center; font-size: 13px;
    background: #6B2D1F; color: #fff; flex-shrink: 0;
  }
  .banner[hidden] { display: none; }

  /* ── Header ─────────────────────────────────────────────────────────── */
  header {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--raised);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    background: var(--bad); transition: background 200ms ease;
  }
  .dot[data-live] { background: var(--good); }
  #deck-title {
    font-size: 15px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .head-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .count { font-size: 18px; letter-spacing: 0.04em; color: var(--muted); }
  .count b { color: var(--ink); font-weight: 600; }
  #reload-deck { min-width: 108px; }

  /* ── Buttons ────────────────────────────────────────────────────────── */
  button {
    font: inherit; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 12px; cursor: pointer; white-space: nowrap;
    background: transparent; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 4px;
    transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
  }
  button:hover { color: var(--ink); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: 0.35; cursor: default; }
  button[disabled]:hover { color: var(--muted); border-color: var(--hairline); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #17110A;
    font-weight: 600;
  }
  button.primary:hover { background: #E8A233; border-color: #E8A233; color: #17110A; }
  button[data-on] { color: var(--ink); border-color: var(--accent); background: rgba(216,144,31,0.16); }
  button.danger[data-on] { color: #fff; border-color: var(--bad); background: var(--bad); }

  /* ── Body grid ──────────────────────────────────────────────────────── */
  .body {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: var(--rundown-w) minmax(0, 1fr) var(--preview-w);
  }
  @media (max-width: 1240px) {
    .body { grid-template-columns: var(--rundown-w) minmax(0, 1fr); }
    .previews { display: none; }
  }
  @media (max-width: 900px) {
    .body { grid-template-columns: minmax(0, 1fr); }
    .rundown { display: none; }
  }

  /* ── Rundown ────────────────────────────────────────────────────────── */
  .rundown {
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--hairline);
    background: var(--sunken);
  }
  .col-head, .col-foot {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px 14px;
  }
  .col-head { border-bottom: 1px solid var(--hairline); }
  .col-foot { border-top: 1px solid var(--hairline); }
  .col-foot button { flex: 1; font-size: 10px; padding: 7px 6px; }
  .col-head .eyebrow { color: var(--muted); }
  #plan-total { font-size: 13px; color: var(--ink-soft); }

  .rows { flex: 1; min-height: 0; overflow-y: auto; }
  .row {
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr) 58px 46px;
    align-items: center; gap: 8px;
    padding: 8px 14px;
    border-bottom: 1px solid rgba(247, 243, 236, 0.05);
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .row:hover { background: rgba(247, 243, 236, 0.04); }
  .row[data-current] {
    background: rgba(216, 144, 31, 0.12);
    border-left-color: var(--accent);
  }
  .row .n { font-size: 11px; color: var(--muted); }
  .row[data-current] .n { color: var(--accent); }
  .row .label {
    font-size: 13px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row[data-current] .label { color: var(--ink); }
  .row .snd { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .row .actual { font-size: 11px; color: var(--muted); text-align: right; }
  .row .actual[data-over] { color: var(--bad); }

  .row input {
    font: inherit;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px; width: 100%; text-align: right;
    padding: 4px 6px;
    color: var(--ink-soft); background: rgba(247, 243, 236, 0.06);
    border: 1px solid transparent; border-radius: 3px;
    -moz-appearance: textfield;
  }
  .row input::-webkit-outer-spin-button,
  .row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row input:hover { border-color: var(--hairline); }
  .row input:focus { outline: none; border-color: var(--accent); color: var(--ink); }

  /* ── Centre column ──────────────────────────────────────────────────── */
  main {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    padding: 18px 24px; gap: 16px;
  }

  .timer { flex-shrink: 0; }
  .big {
    font-size: clamp(56px, 9vw, 104px); line-height: 0.95;
    letter-spacing: -0.02em; font-weight: 500;
  }
  body[data-paused] .big { color: var(--muted); }
  .timer-meta {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 8px;
  }
  #plan-of { font-size: 14px; color: var(--muted); }
  .pace {
    font-size: 12px; padding: 4px 10px; border-radius: 3px;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--hairline); color: var(--muted);
  }
  .pace[data-state="ahead"] { color: var(--good); border-color: rgba(74, 154, 107, 0.5); }
  .pace[data-state="behind"] { color: var(--bad); border-color: rgba(196, 69, 43, 0.5); }
  .pace[data-state="on"] { color: var(--ink-soft); }
  .pace[hidden], .badge[hidden] { display: none; }
  .badge {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 3px;
    background: var(--accent); color: #17110A; font-weight: 600;
  }
  .badge.edit {
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); font-weight: 500;
  }

  .slide-bar {
    height: 6px; border-radius: 3px; margin-top: 14px;
    background: rgba(247, 243, 236, 0.10); overflow: hidden;
  }
  .slide-fill {
    height: 100%; width: 0%; background: var(--good);
    transition: width 400ms linear, background 300ms ease;
  }
  .slide-fill[data-over] { background: var(--bad); }
  .slide-meta {
    display: flex; justify-content: space-between; gap: 16px;
    margin-top: 7px; font-size: 12px; color: var(--muted);
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .slide-meta b { font-weight: 500; color: var(--ink-soft); font-size: 13px; }

  .notes { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #slide-label { color: var(--accent); }
  .note {
    flex: 1; min-height: 0; overflow-y: auto;
    font-size: clamp(20px, 2.3vw, 34px); line-height: 1.36;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note.empty { color: var(--muted); font-style: italic; }

  .next-note {
    flex-shrink: 0;
    border: 1px solid var(--hairline); border-left: 3px solid var(--accent);
    background: rgba(247, 243, 236, 0.04);
    padding: 12px 16px;
  }
  .next-note[hidden] { display: none; }
  .next-text {
    margin-top: 6px; font-size: 15px; line-height: 1.5; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── Previews ───────────────────────────────────────────────────────── */
  .previews {
    display: flex; flex-direction: column; gap: 14px;
    padding: 18px 20px; min-height: 0;
    border-left: 1px solid var(--hairline);
    background: var(--sunken);
  }
  .preview-box { display: flex; flex-direction: column; gap: 7px; }
  .frame {
    position: relative; width: 100%;
    background: #000; border: 1px solid var(--hairline);
    overflow: hidden;
  }
  .frame iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; pointer-events: none;
  }
  .frame[data-blackout]::after {
    content: "BLACK";
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: var(--bad);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: 0.3em;
  }
  .frame.empty::after {
    content: "End of deck";
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--sunken); color: var(--muted); font-size: 12px;
  }

  /* ── Transport ──────────────────────────────────────────────────────── */
  footer {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px;
    border-top: 1px solid var(--hairline);
    background: var(--raised);
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .spacer { flex: 1; }
  .sep { width: 1px; height: 22px; background: var(--hairline); margin: 0 4px; }
  .nav-btn { font-size: 15px; padding: 6px 16px; letter-spacing: 0; }

  .mixer { display: flex; align-items: center; gap: 10px; }
  .mixer input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 132px; height: 4px; border-radius: 2px;
    background: rgba(247, 243, 236, 0.16); outline: none;
  }
  .mixer input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); cursor: pointer;
  }
  .mixer input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 50%;
    background: var(--ink); cursor: pointer;
  }
  .mixer[data-muted] input[type="range"] { opacity: 0.35; }
  #vol-read { font-size: 12px; color: var(--muted); width: 34px; text-align: right; }
  #audio-led {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(247, 243, 236, 0.16);
  }
  #audio-led[data-playing] { background: var(--good); }

  .hint { font-size: 11px; color: var(--muted); }
  kbd {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px;
    padding: 2px 5px; margin: 0 1px;
    background: rgba(247, 243, 236, 0.08);
    border: 1px solid var(--hairline); border-radius: 3px; color: var(--ink);
  }

  body[data-blackout] header { background: #3A1611; }
  body[data-blackout] #deck-title::after {
    content: " · projector black";
    color: var(--bad); letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px;
  }
</style>
</head>
<body>
  <div class="banner mono" id="banner" hidden></div>

  <header>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <span id="deck-title">Loading deck...</span>
    </div>
    <div class="head-right">
      <span class="count mono"><b id="cur">&mdash;</b> / <span id="total">&mdash;</span></span>
      <button id="reload-deck" title="Re-read the deck file, refresh the notes and thumbnails, and reload the projector">Reload deck</button>
      <button id="open-projector" class="primary">Open projector</button>
    </div>
  </header>

  <div class="body">
    <aside class="rundown">
      <div class="col-head">
        <span class="eyebrow">Rundown</span>
        <span class="mono" id="plan-total">&mdash;</span>
      </div>
      <div class="rows" id="rundown-rows"></div>
      <div class="col-foot">
        <button id="restore-plan" title="Reload the budgets authored in the deck file">Deck plan</button>
        <button id="copy-plan" title="Copy the measured run as a #deck-plan array" disabled>Copy measured</button>
      </div>
    </aside>

    <main>
      <section class="timer">
        <div class="big mono" id="elapsed">00:00</div>
        <div class="timer-meta">
          <span class="mono" id="plan-of"></span>
          <span class="pace" id="pace" hidden></span>
          <span class="badge" id="paused-badge" hidden>Paused</span>
          <span class="badge edit" id="edited-badge" hidden title="These budgets differ from the plan in the deck file">Edited plan</span>
        </div>
        <div class="slide-bar"><div class="slide-fill" id="slide-fill"></div></div>
        <div class="slide-meta mono">
          <span>This slide <b id="slide-spent">0:00</b> / <b id="slide-budget">0:00</b></span>
          <span id="plan-left"></span>
        </div>
      </section>

      <section class="notes">
        <div class="eyebrow">Now speaking &middot; <span id="slide-label"></span></div>
        <div class="note empty" id="note">Waiting for the deck to report its position...</div>
      </section>

      <section class="next-note" id="next-note" hidden>
        <div class="eyebrow">Next &middot; <span id="next-label"></span></div>
        <div class="next-text" id="next-text"></div>
      </section>
    </main>

    <aside class="previews">
      <div class="preview-box">
        <span class="eyebrow">On screen</span>
        <div class="frame" id="preview-now"></div>
      </div>
      <div class="preview-box">
        <span class="eyebrow">Up next</span>
        <div class="frame" id="preview-next"></div>
      </div>
    </aside>
  </div>

  <footer>
    <div class="group">
      <button class="nav-btn" id="prev" title="Previous slide (Left arrow)">&#8592;</button>
      <button class="nav-btn" id="next" title="Next slide (Right arrow, Space)">&#8594;</button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="pause" title="Pause the clock (P)">Pause</button>
      <button id="reset" title="Reset the clock and the measured run (R)">Reset</button>
    </div>
    <div class="sep"></div>
    <button id="blackout" class="danger" title="Black out the projector (B)">Black</button>
    <div class="sep"></div>
    <div class="mixer" id="mixer">
      <span id="audio-led" title="A slide clip is playing"></span>
      <button id="mute" title="Mute the deck (M)">Mute</button>
      <input type="range" id="volume" min="0" max="100" step="1" value="100"
             aria-label="Master volume" />
      <span class="mono" id="vol-read">100</span>
    </div>
    <div class="spacer"></div>
    <div class="hint mono">
      <kbd>&#8592;</kbd><kbd>&#8594;</kbd> slide
      <kbd>P</kbd> pause <kbd>B</kbd> black <kbd>M</kbd> mute <kbd>R</kbd> reset
    </div>
    <button id="fullscreen" title="Fullscreen (F)">Full</button>
  </footer>

  <script type="module" src="panel/main.js"></script>
</body>
</html>
